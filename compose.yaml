services:
  anulist:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: anulist
    restart: unless-stopped
    environment:
      ANULIST_DB: /data/anulist.db
      ANULIST_MEDIA: /data/media
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:${ANULIST_PORT:-8765}:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
