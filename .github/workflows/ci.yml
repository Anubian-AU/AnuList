name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
      - run: node --check frontend/sw.js
      - run: python -c "import json;json.load(open('frontend/manifest.webmanifest'))"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t anulist:test .
