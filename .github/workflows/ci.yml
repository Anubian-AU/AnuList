name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: python -m compileall -q backend scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/app.js
      - run: node --check frontend/sw.js
      - run: python -c "import json;json.load(open('frontend/manifest.webmanifest'))"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t anulist:test .
      - name: Boot and health-test the container
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          sudo chown 10001:10001 "$scratch"
          docker run -d --name anulist-smoke -e COOKIE_SECURE=false -v "$scratch:/data" -p 127.0.0.1:8765:8000 anulist:test
          trap 'docker rm -f anulist-smoke >/dev/null 2>&1 || true; sudo rm -rf "$scratch"' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/
          docker exec anulist-smoke python -c "import sqlite3; assert sqlite3.connect('/data/anulist.db').execute('PRAGMA user_version').fetchone()[0] == 1"
